name: Deploy NestJS Docker

on:
  push:
    branches: [ "develop", "feature/config-deploy" ]
  pull_request:
    branches: [ "develop" ]

permissions:
  packages: write
  contents: read

jobs:
  deploy-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set repository name to lowercase
        run: echo "REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}:latest
            ghcr.io/${{ env.REPO_LC }}:${{ github.sha }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.REMOTE_PORT }}
          script: |
            # Iniciar sesión en GHCR desde el servidor
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Descargar la última imagen
            docker pull ghcr.io/${{ env.REPO_LC }}:latest

            # Ejecutar migraciones de base de datos
            docker run --rm \
              -e CASSANDRA_CONTACT_POINTS="${{ secrets.CASSANDRA_CONTACT_POINTS }}" \
              -e CASSANDRA_LOCAL_DATA_CENTER="${{ secrets.CASSANDRA_LOCAL_DATA_CENTER }}" \
              -e CASSANDRA_KEYSPACE="${{ secrets.CASSANDRA_KEYSPACE }}" \
              -e CASSANDRA_USERNAME="${{ secrets.CASSANDRA_USERNAME }}" \
              -e CASSANDRA_PASSWORD="${{ secrets.CASSANDRA_PASSWORD }}" \
              ghcr.io/${{ env.REPO_LC }}:latest \
              node scripts/run-cassandra-migrations.mjs

            # Ejecutar seed de carpetas
            docker run --rm \
              -e CASSANDRA_CONTACT_POINTS="${{ secrets.CASSANDRA_CONTACT_POINTS }}" \
              -e CASSANDRA_LOCAL_DATA_CENTER="${{ secrets.CASSANDRA_LOCAL_DATA_CENTER }}" \
              -e CASSANDRA_KEYSPACE="${{ secrets.CASSANDRA_KEYSPACE }}" \
              -e CASSANDRA_USERNAME="${{ secrets.CASSANDRA_USERNAME }}" \
              -e CASSANDRA_PASSWORD="${{ secrets.CASSANDRA_PASSWORD }}" \
              ghcr.io/${{ env.REPO_LC }}:latest \
              node scripts/seed-folders.mjs

            # Detener y eliminar contenedor existente
            docker stop storage-service || true
            docker rm storage-service || true

            # Iniciar nuevo contenedor
            docker run -d \
              --name storage-service \
              -p ${{ secrets.PORT }}:${{ secrets.PORT }} \
              -e PORT="${{ secrets.PORT }}" \
              -e CASSANDRA_CONTACT_POINTS="${{ secrets.CASSANDRA_CONTACT_POINTS }}" \
              -e CASSANDRA_LOCAL_DATA_CENTER="${{ secrets.CASSANDRA_LOCAL_DATA_CENTER }}" \
              -e CASSANDRA_KEYSPACE="${{ secrets.CASSANDRA_KEYSPACE }}" \
              -e CASSANDRA_USERNAME="${{ secrets.CASSANDRA_USERNAME }}" \
              -e CASSANDRA_PASSWORD="${{ secrets.CASSANDRA_PASSWORD }}" \
              -e SWAGGER_USER="${{ secrets.SWAGGER_USER }}" \
              -e SWAGGER_PASS="${{ secrets.SWAGGER_PASS }}" \
              -e API_KEY="${{ secrets.API_KEY }}" \
              --restart unless-stopped \
              ghcr.io/${{ env.REPO_LC }}:latest

            # Limpiar imágenes antiguas
            docker image prune -f
