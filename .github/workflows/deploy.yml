name: Deploy NestJS

on:
  push:
    branches: [  ] # Se desactiva 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.REMOTE_PORT }}
          script: |
            cd ~/Documentos/cda/services/storage-service
            git pull origin develop
            npm install
            npm run db:migrate
            npm run build
            # Si usas pm2 para que no se apague:
            pm2 restart storage-service || pm2 start dist/main.js --name storage-service